# Render blueprint for Playr: one Node web service that serves both the API and
# the built React app. The database is external (Neon, Supabase, or Render's own
# managed Postgres) and supplied through DATABASE_URL.
services:
  - type: web
    name: playr
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard. sync: false keeps them out of the repo.
      - key: DATABASE_URL
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
